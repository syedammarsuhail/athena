# Local dev compose for the agent + its deps. Useful for fixture tests offline.
version: "3.9"
services:
  nats:
    image: nats:2.10-alpine
    ports: ["4222:4222"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  opa:
    image: openpolicyagent/opa:0.66.0
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes: ["./policies:/policies:ro"]
    ports: ["8181:8181"]
  agent:
    build: .
    environment:
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379/0
      OPA_URL: http://opa:8181
      PROM_MCP: http://prom-mcp:8080
      LOKI_MCP: http://loki-mcp:8080
      K8S_MCP:  http://k8s-mcp:8080
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on: [nats, redis, opa]
  slack-bot:
    build: .
    command: uvicorn slack_bot:app --host 0.0.0.0 --port 8000
    environment:
      REDIS_URL: redis://redis:6379/0
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
    ports: ["8000:8000"]
    depends_on: [redis]
