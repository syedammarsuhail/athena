name: terraform

on:
  pull_request:
    paths: ['infra/terraform/**']
  push:
    branches: [main, master]
    paths: ['infra/terraform/**']

permissions:
  id-token: write   # OIDC
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_letsencrypt_email: ${{ secrets.TF_VAR_LETSENCRYPT_EMAIL }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev]   # add stage, prod when ready
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init

      - name: terraform validate
        run: terraform validate

      - name: tflint
        uses: terraform-linters/setup-tflint@v4
      - run: tflint --init && tflint -f compact || true

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3

      - name: terraform plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color -out=tf.plan | tee plan.txt

      - name: comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/infra/terraform/environments/${{ matrix.env }}/plan.txt`, 'utf8');
            const body = `### Terraform plan — \`${{ matrix.env }}\`\n\n<details><summary>show plan</summary>\n\n\`\`\`\n${plan.slice(0, 60000)}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

      - name: terraform apply
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
        run: terraform apply -auto-approve
