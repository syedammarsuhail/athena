apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress.yaml

patches:
  # Smaller replicas for dev
  - target: { kind: Deployment }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

  # Frontend needs this env var even when assistant feature is disabled
  - target: { kind: Deployment, name: frontend }
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SHOPPING_ASSISTANT_SERVICE_ADDR
          value: "shoppingassistantservice:80"

  # OTel: activate tracing → OTel Collector → Tempo → Grafana (open source)
  - path: otel-patches.yaml

  # Datadog APM: activate tracing → Datadog Agent → Datadog Cloud (commercial)
  # Comment out otel-patches.yaml above and use this instead for Datadog
  # - path: datadog-patches.yaml
