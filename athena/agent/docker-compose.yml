# Local dev compose for the agent + its deps. Useful for fixture tests offline.
version: "3.9"
services:
  nats:
    image: nats:2.10-alpine
    ports: ["4222:4222"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  opa:
    image: openpolicyagent/opa:0.66.0
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes: ["./policies:/policies:ro"]
    ports: ["8181:8181"]
  agent:
    build: .
    environment:
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379/0
      OPA_URL: http://opa:8181
      PROM_MCP: http://prom-mcp:8080
      LOKI_MCP: http://loki-mcp:8080
      K8S_MCP:  http://k8s-mcp:8080
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-llama-3.3-70b-versatile}
      SLACK_BOT_API: http://slack-bot:8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      GRAFANA_URL: ${GRAFANA_URL:-http://localhost:3000}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: athena-agent
    depends_on: [nats, redis, opa, otel-collector]
  slack-bot:
    build: .
    command: uvicorn slack_bot:app --host 0.0.0.0 --port 8000
    environment:
      REDIS_URL: redis://redis:6379/0
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
    ports: ["8000:8000"]
    depends_on: [redis]

  # OTel Collector — receives traces from agent, forwards to Tempo
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC — agent sends traces here
      - "4318:4318"   # OTLP HTTP
    depends_on: [tempo]

  # Tempo — stores traces (like Prometheus but for traces)
  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo-config.yaml"]
    volumes:
      - ./tempo-config.yaml:/etc/tempo-config.yaml:ro
      - tempo-data:/tmp/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API

  # Grafana — visualize metrics + traces in one place
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "3000:3000"
    depends_on: [tempo]

  # Datadog Agent — collects metrics, traces, logs from all containers
  datadog:
    image: gcr.io/datadoghq/agent:7
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_CONTAINER_EXCLUDE: "name:datadog-agent"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
    ports:
      - "8126:8126"   # APM traces
      - "8125:8125/udp"  # StatsD metrics

volumes:
  tempo-data:
