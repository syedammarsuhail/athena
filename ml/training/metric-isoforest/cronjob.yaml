apiVersion: batch/v1
kind: CronJob
metadata:
  name: isoforest-train
  namespace: mlops
spec:
  schedule: "0 3 * * *"   # 03:00 UTC nightly
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: isoforest-trainer
          containers:
            - name: train
              image: <ECR>/athena/ml-isoforest:<TAG>
              command: ["python", "train.py"]
              args:
                - --prom-url=http://kube-prometheus-stack-prometheus.monitoring.svc:9090
                - --metrics=container_memory_working_set_bytes,container_cpu_usage_seconds_total,nginx_ingress_controller_request_duration_seconds_sum
                - --namespaces=online-boutique
                - --window-days=7
                - --contamination=0.01
                - --mlflow-uri=http://mlflow.mlops:5000
              resources:
                requests: { cpu: 500m, memory: 1Gi }
                limits:   { cpu: 2,    memory: 4Gi }
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
