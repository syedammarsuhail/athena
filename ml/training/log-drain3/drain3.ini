[SNAPSHOT]
snapshot_interval_minutes = 5
compress_state = True

[MASKING]
masking = [
    {"regex_pattern":"((?<=[^A-Za-z0-9])|^)(?:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})((?=[^A-Za-z0-9])|$)", "mask_with": "UUID"},
    {"regex_pattern":"((?<=[^A-Za-z0-9])|^)((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(\\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)){3})((?=[^A-Za-z0-9])|$)", "mask_with": "IP"},
    {"regex_pattern":"((?<=[^A-Za-z0-9])|^)([0-9a-f]{2}(:[0-9a-f]{2}){5})((?=[^A-Za-z0-9])|$)", "mask_with": "MAC"},
    {"regex_pattern":"((?<=[^A-Za-z0-9])|^)([0-9]+\\.?[0-9]*)((?=[^A-Za-z0-9])|$)", "mask_with": "NUM"}
    ]
mask_prefix = <
mask_suffix = >

[DRAIN]
sim_th = 0.4
depth = 4
max_children = 100
max_clusters = 1024
extra_delimiters = ["_"]

[PROFILING]
enabled = False
