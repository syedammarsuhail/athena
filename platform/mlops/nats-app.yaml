apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nats
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://nats-io.github.io/k8s/helm/charts
    chart: nats
    targetRevision: 1.2.7
    helm:
      values: |
        config:
          cluster: { enabled: true, replicas: 3 }
          jetstream:
            enabled: true
            fileStore: { enabled: true, pvc: { size: 5Gi } }
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
