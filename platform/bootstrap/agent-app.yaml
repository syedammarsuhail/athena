apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: athena-agent
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/syedammarsuhail/athena.git
    targetRevision: main
    path: agent
  destination:
    server: https://kubernetes.default.svc
    namespace: agent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
